<html>

<head>
  <title>Calculadora Simples?</title>
  <link rel="stylesheet" href="estilo.css">
</head>

<body>
  <div id="div_display">
    <textarea id="display"></textarea>
    <div id="div_botoes">
      <button value="%">%</button>  <button value="CE" name="ignore">CE</button> <button value="sinal" name="ignore">+/-</button>  <button value="/">÷</button>
      <button value="7">7</button>  <button value="8">8</button>              <button value="9">9</button>                      <button value="*">×</button>
      <button value="4">4</button>  <button value="5">5</button>              <button value="6">6</button>                      <button value="+">+</button>
      <button value="1">1</button>  <button value="2">2</button>              <button value="3">3</button>                      <button value="-">-</button>
      <button value=".">,</button>  <button value="0">0</button>              <button value="e">e</button>                      <button value="=" name="ignore">=</button>
    </div>

  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>


</body>

</html>
